[package]
name = "clover-launcher"
version = "0.1.0"
description = "Launcher officiel de Clover Games"
authors = ["Clover Games"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clover_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
base64 = "0.23.1"
url = "2.5.8"
thiserror = "2.0.21"
rand = "0.10.3"
tokio = { version = "1.53.1", features = ["net", "io-util", "time", "sync", "fs", "process", "macros", "rt"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form"] }
keyring = "4.2.0"
futures-util = "0.3.34"
sha1 = "0.11.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
ed25519-dalek = "2"
discord-rich-presence = "1.1.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
