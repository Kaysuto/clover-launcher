[package]
name = "clover-launcher"
version = "0.3.0"
description = "Launcher officiel de Clover Games"
authors = ["Clover Games"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clover_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
base64 = "0.23.1"
flate2 = "1"
url = "2.5.8"
thiserror = "2.0.21"
rand = "0.10.3"
tokio = { version = "1.53.1", features = ["net", "io-util", "time", "sync", "fs", "process", "macros", "rt"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form", "multipart"] }
keyring = "4.2.0"
futures-util = "0.3.34"
sha1 = "0.11.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
ed25519-dalek = "2"
discord-rich-presence = "1.1.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tauri-plugin-autostart = "2.6.0"
tauri-plugin-single-instance = "2.5.1"
hickory-resolver = "0.26"
ammonia = "4.2.1"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
crc32fast = "1.5"
trash = { version = "5", default-features = false, features = ["coinit_apartmentthreaded"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }


# Paquet MSIX du Microsoft Store : détection et tâche de démarrage (msix.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_Packaging_Appx", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.61", features = ["ApplicationModel", "ApplicationModel_Activation", "Foundation", "Win32_Graphics_Dxgi"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
